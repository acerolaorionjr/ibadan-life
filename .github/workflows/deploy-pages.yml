name: Deploy Ibadan Life to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ibadan-life-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate game JavaScript
        run: |
          node --check game.js
          node --check multiplayer.js
          node --check multiplayer-config.js
      - name: Validate required files
        run: |
          test -s index.html
          test -s game.js
          test -s manifest.json
          test -s sw.js
          grep -q 'game.js' index.html
          echo "Ibadan Life source checks passed."
      - name: Run mobile browser smoke test
        run: |
          python -m pip install --disable-pip-version-check pytest playwright
          python -m playwright install --with-deps chromium
          pytest -q tests
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
