name: Ibadan Life Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript
        run: |
          node --check game.js
          node --check multiplayer.js
          node --check multiplayer-config.js
      - name: Validate required multiplayer assets
        run: |
          test -s index.html
          test -s multiplayer.css
          test -s multiplayer.js
          test -s multiplayer-config.js
          test -s supabase/ibadan_life_multiplayer.sql
      - name: Run source and browser tests
        run: |
          python -m pip install --disable-pip-version-check pytest playwright
          python -m playwright install --with-deps chromium
          pytest -q tests
